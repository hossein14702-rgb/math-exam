<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پنل معلم</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f5f7fb;color:#222}
.container{width:95%;max-width:1450px;margin:25px auto}
.header,.settings-box,.question-bank-box,.table-box{background:#fff;border-radius:16px;padding:20px;box-shadow:0 4px 18px rgba(0,0,0,.07);margin-bottom:20px}
.header h1{margin:0 0 8px;font-size:25px}
.header p{margin:0;color:#666;font-size:14px}
.controls{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap}
button{border:0;border-radius:10px;padding:10px 16px;font-family:inherit;font-size:14px;cursor:pointer}
button:disabled{opacity:.6;cursor:not-allowed}
.refresh-btn,.primary-btn{background:#2563eb;color:#fff}
.delete-all-btn,.danger-btn{background:#dc2626;color:#fff}
.success-btn{background:#16a34a;color:#fff}
.warning-btn{background:#d97706;color:#fff}
.gray-btn{background:#e5e7eb;color:#111827}
.small-btn{padding:6px 10px;font-size:12px;margin:2px}
.section-title{margin:0 0 6px;font-size:20px}
.section-description{color:#64748b;font-size:13px;margin-bottom:18px}

/* صفحه ورود */
.login-wrapper{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#eff6ff 0%,#f5f7fb 100%)}
.login-box{width:100%;max-width:420px;background:#fff;border-radius:18px;padding:32px 28px;box-shadow:0 10px 40px rgba(0,0,0,.1)}
